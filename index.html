<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chipference</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b6b6b; --faint:#9a9a9a; --line:#e3e3e3; --bg:#fff; --panel:#f7f7f7; --grid:#efefef; --accent:#1a1a1a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg:#e6e6e6; --muted:#9a9a9a; --faint:#6b6b6b; --line:#2c2c2c; --bg:#141414; --panel:#1a1a1a; --grid:#222; --accent:#e6e6e6; }
  }
  :root[data-theme="dark"] { --fg:#e6e6e6; --muted:#9a9a9a; --faint:#6b6b6b; --line:#2c2c2c; --bg:#141414; --panel:#1a1a1a; --grid:#222; --accent:#e6e6e6; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
  .app { display:flex; min-height:100vh; }
  aside { width:272px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:16px 16px 24px; overflow-y:auto; max-height:100vh; }
  main { flex:1; min-width:0; padding:16px 24px 32px; }

  h1 { font-size:14px; font-weight:600; margin:0; }
  .sub { color:var(--muted); font-size:12px; margin:2px 0 0; }
  .sec { margin-top:18px; }
  .sec-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .field { margin:6px 0; }
  .field > .lab { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; }
  label.check { display:flex; align-items:center; gap:6px; margin:4px 0; cursor:pointer; }

  .seg { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--bg); }
  .seg button { flex:1; border:none; background:none; padding:4px 6px; font:inherit; font-size:12px; color:var(--muted); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:var(--bg); }

  input[type=number], select { font:inherit; font-size:12px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:3px 5px; }
  input[type=number] { width:100%; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .linkbtn { border:none; background:none; padding:0; font:inherit; font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }

  .chip { border-top:1px solid var(--line); padding:6px 0; }
  .chip:last-of-type { border-bottom:1px solid var(--line); }
  .chip-row { display:flex; align-items:center; gap:8px; }
  .chip-row .name { flex:1; min-width:0; border:none; background:none; font:inherit; color:var(--fg); padding:0; }
  .chip-row .name:focus { outline:1px solid var(--line); }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; cursor:pointer; position:relative; }
  .dot input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .chip.off .name { color:var(--faint); text-decoration:line-through; }
  .chip.off .dot { opacity:.35; }
  .icon { border:none; background:none; color:var(--faint); cursor:pointer; padding:0 2px; font-size:13px; line-height:1; }
  .icon:hover { color:var(--fg); }
  .specs { display:grid; grid-template-columns:1fr 64px; gap:3px 8px; margin:8px 0 4px 18px; font-size:12px; }
  .specs span { color:var(--muted); align-self:center; }
  .specs input:disabled { color:var(--muted); background:transparent; }
  .derived { margin:8px 0 0 18px; font-size:12px; color:var(--muted); }
  .derived select { font-size:11px; padding:1px 3px; }
  .chip-actions { display:flex; gap:12px; margin-top:8px; }

  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; margin:0 0 4px 56px; font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:14px; height:2px; display:inline-block; }
  svg.plot { width:100%; display:block; user-select:none; }

  table.read { border-collapse:collapse; width:100%; margin-top:8px; font-size:12px; font-variant-numeric:tabular-nums; }
  table.read th { text-align:left; font-weight:500; color:var(--muted); border-bottom:1px solid var(--line); padding:4px 10px 4px 0; white-space:nowrap; }
  table.read td { padding:4px 10px 4px 0; border-bottom:1px solid var(--grid); white-space:nowrap; }
  table.read td.num, table.read th.num { text-align:right; }
  .bar { display:flex; width:160px; height:8px; border-radius:2px; overflow:hidden; background:var(--grid); }
  .bar b { display:block; height:100%; }
  .keys { display:flex; gap:12px; color:var(--muted); font-size:11px; margin-top:6px; }
  .keys i { display:inline-block; width:8px; height:8px; border-radius:1px; margin-right:4px; vertical-align:-1px; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  details.assume { margin-top:20px; color:var(--muted); font-size:12px; }
  details.assume summary { cursor:pointer; }
  details.assume table { border-collapse:collapse; margin-top:6px; }
  details.assume td { padding:2px 12px 2px 0; vertical-align:top; }
  details.assume td:first-child { white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  @media (max-width: 820px) { .app { flex-direction:column; } aside { width:auto; max-height:none; border-right:none; border-bottom:1px solid var(--line); } main { padding:16px; } .legend { margin-left:0; } }
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Chipference</h1>
  <p class="sub">Roofline Pareto model of LLM decode across chip generations</p>

  <div class="sec">
    <div class="sec-title">Chart</div>
    <div class="field"><span class="lab">X axis</span>
      <div class="seg" id="xmode"><button data-v="interactivity">Interactivity</button><button data-v="concurrency">Concurrency</button></div>
    </div>
    <div class="field"><span class="lab">Y axis</span>
      <div class="seg" id="ymetric"><button data-v="thr">tok/s / GPU</button><button data-v="perKW">tok/s / kW</button></div>
    </div>
    <div class="field"><span class="lab">Compare against</span><select id="baseline" style="width:100%"></select></div>
    <label class="check"><input type="checkbox" id="gains"> Generation gains (× vs next chip down)</label>
    <label class="check"><input type="checkbox" id="logy"> Log Y (equal ratios look equal)</label>
    <label class="check"><input type="checkbox" id="sol"> Speed of light (dashed)</label>
  </div>

  <div class="sec">
    <div class="sec-title">Workload</div>
    <div class="pair">
      <div class="field"><span class="lab">Input tokens</span><input type="number" id="isl" min="128" step="1024"></div>
      <div class="field"><span class="lab">Output tokens</span><input type="number" id="osl" min="16" step="256"></div>
    </div>
    <label class="check"><input type="checkbox" id="prefill"> Count prefill GPUs</label>
  </div>

  <div class="sec">
    <div class="sec-title">Parallelism searched</div>
    <label class="check"><input type="checkbox" checked disabled> Tensor parallel</label>
    <label class="check"><input type="checkbox" id="pp"> Pipeline parallel</label>
    <label class="check"><input type="checkbox" id="dpattn"> DP attention</label>
  </div>

  <div class="sec">
    <div class="sec-title">Chips</div>
    <div id="chips"></div>
    <div class="chip-actions"><button class="linkbtn" id="addchip">Add chip</button><button class="linkbtn" id="reset">Reset</button></div>
  </div>
</aside>

<main>
  <div class="legend" id="legend"></div>
  <svg id="plot" class="plot"></svg>
  <div class="table-wrap"><table class="read" id="read"></table></div>
  <div class="keys" id="keys"></div>
  <div class="hint" id="hint">Hover the chart to compare chips at one point. Click to pin.</div>
  <details class="assume"><summary>Assumptions</summary><table id="assume"></table></details>
</main>
</div>

<script src="model.js"></script>
<script>
'use strict';
const SPEC_FIELDS = [
  ['fp4', 'Dense FP4 (PFLOPS)'],
  ['fp8', 'Dense FP8 (PFLOPS)'],
  ['hbmGB', 'HBM (GB)'],
  ['hbmTBs', 'HBM BW (TB/s)'],
  ['nvlTBs', 'NVLink bidir (TB/s)'],
  ['domain', 'NVLink domain (GPUs)'],
  ['nicGbps', 'Scale-out NIC (Gb/s)'],
  ['watts', 'All-in W / GPU'],
];

const DEFAULT_CHIPS = [
  // Sources: NVIDIA HGX / GB300 NVL72 / Vera Rubin NVL72 product pages (Nov 2026), DGX B300 user guide.
  // Power = rack power / GPUs (GB300 NVL72 ~137 kW, OEMs; VR NVL72 ~190 kW Max-Q, SemiAnalysis/Kuo).
  // Listed newest first, so legend, chip list and table read top-down in the same order as the curves.
  { id:'lebron', name:'LebronChip', color:'#7b2fbe', visible:true, extrapolate:{ from:'gb300', to:'rubin' },
    fp4:0, fp8:0, hbmGB:0, hbmTBs:0, nvlTBs:0, domain:72, nicGbps:0, watts:0 },
  { id:'rubin', name:'Vera Rubin NVL72', color:'#1c7ed6', visible:true, fp4:35, fp8:17.5, hbmGB:288, hbmTBs:19.2, nvlTBs:3.0, domain:72, nicGbps:1600, watts:2640 },
  { id:'gb300', name:'GB300 NVL72', color:'#2f9e44', visible:true, fp4:15, fp8:5, hbmGB:288, hbmTBs:8, nvlTBs:1.8, domain:72, nicGbps:800, watts:1900 },
];
const PALETTE = ['#e8590c', '#c2255c', '#0c8599', '#5f3dc4', '#a07a00'];
const SPLIT = [['weights', 'Weight reads', '#4c6ef5'], ['kv', 'KV reads', '#15aabf'], ['compute', 'Compute', '#fab005'], ['comm', 'Comms', '#fa5252'], ['overhead', 'Fixed overhead', '#adb5bd']];

const DEFAULT_STATE = {
  xmode:'interactivity', ymetric:'thr', baseline:'gb300', sol:false, logy:false, gains:true,
  isl:8192, osl:1024, prefill:true, pp:true, dpattn:true,
  chips: DEFAULT_CHIPS,
};

let state = loadState();
let pinnedX = null, cache = null, geo = null;
const openChips = new Set();

// ---------------------------------------------------------------- state / URL
function loadState() {
  try { const h = location.hash.slice(1); if (h) return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(decodeURIComponent(atob(h)))); } catch (e) {}
  return structuredClone(DEFAULT_STATE);
}
function saveState() { try { history.replaceState(null, '', '#' + btoa(encodeURIComponent(JSON.stringify(state)))); } catch (e) {} }

// Extrapolated chip: spec = to × (to / from), per field. NVLink domain kept as entered.
function resolvedChips() {
  const byId = Object.fromEntries(state.chips.map(c => [c.id, c]));
  return state.chips.map(c => {
    if (!c.extrapolate) return c;
    const a = byId[c.extrapolate.from], b = byId[c.extrapolate.to];
    if (!a || !b || a.extrapolate || b.extrapolate) return c;
    const r = Object.assign({}, c);
    for (const [k] of SPEC_FIELDS) if (k !== 'domain') r[k] = +(b[k] * b[k] / a[k]).toPrecision(4);
    return r;
  });
}
const nameOf = id => (state.chips.find(c => c.id === id) || {}).name || '?';
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const pct = x => Math.round(x * 100) + '%';
const newId = () => 'c' + Math.random().toString(36).slice(2, 8);

// ---------------------------------------------------------------- left panel
function renderControls() {
  for (const id of ['xmode', 'ymetric']) document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === state[id]));
  for (const id of ['isl', 'osl']) document.getElementById(id).value = state[id];
  for (const id of ['sol', 'logy', 'gains', 'prefill', 'pp', 'dpattn']) document.getElementById(id).checked = !!state[id];
  const bsel = document.getElementById('baseline');
  bsel.innerHTML = state.chips.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  bsel.value = state.baseline;

  const res = resolvedChips();
  const box = document.getElementById('chips');
  box.innerHTML = '';
  state.chips.forEach((c, i) => {
    const rc = res[i], ex = c.extrapolate, open = openChips.has(c.id);
    const others = state.chips.filter(o => o.id !== c.id && !o.extrapolate);
    const el = document.createElement('div');
    el.className = 'chip' + (c.visible ? '' : ' off');
    el.innerHTML = `
      <div class="chip-row">
        <span class="dot" style="background:${c.color}" title="Change color"><input type="color" data-k="color" value="${c.color}"></span>
        <input class="name" data-k="name" value="${esc(c.name)}">
        <button class="icon" data-act="vis" title="${c.visible ? 'Hide' : 'Show'}">${c.visible ? '◉' : '○'}</button>
        <button class="icon" data-act="open" title="Edit specs">${open ? '▾' : '▸'}</button>
      </div>
      ${open ? `
        ${ex || others.length >= 2 ? `<div class="derived"><label class="check"><input type="checkbox" data-act="extr" ${ex ? 'checked' : ''}> Extrapolate</label>
          ${ex ? `<select data-act="eto">${others.map(o => `<option value="${o.id}" ${o.id === ex.to ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
          × ( same ÷ <select data-act="efrom">${others.map(o => `<option value="${o.id}" ${o.id === ex.from ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select> )` : ''}</div>` : ''}
        <div class="specs">${SPEC_FIELDS.map(([k, lab]) => `<span>${lab}</span><input type="number" step="any" data-k="${k}" value="${rc[k]}" ${ex && k !== 'domain' ? 'disabled' : ''}>`).join('')}</div>
        <div class="chip-actions" style="margin-left:18px"><button class="linkbtn" data-act="dup">Duplicate</button><button class="linkbtn" data-act="del">Remove</button></div>` : ''}`;

    el.querySelectorAll('[data-k]').forEach(inp => {
      const live = inp.dataset.k === 'name' || inp.dataset.k === 'color';
      inp.addEventListener(live ? 'input' : 'change', () => {
        const k = inp.dataset.k;
        c[k] = inp.type === 'number' ? (parseFloat(inp.value) || 0) : inp.value;
        if (k === 'color') el.querySelector('.dot').style.background = c.color;
        if (k === 'name') { changed(false); return; }
        changed(k !== 'color', k !== 'color' && !!state.chips.find(o => o.extrapolate));
      });
    });
    const on = (act, fn) => { const b = el.querySelector(`[data-act=${act}]`); if (b) b[b.tagName === 'SELECT' || b.type === 'checkbox' ? 'onchange' : 'onclick'] = fn; };
    on('vis', () => { c.visible = !c.visible; changed(true, true); });
    on('open', () => { open ? openChips.delete(c.id) : openChips.add(c.id); renderControls(); });
    on('dup', () => {
      const n = Object.assign(structuredClone(rc), { id: newId(), name: c.name + ' copy', color: PALETTE[state.chips.length % PALETTE.length] });
      delete n.extrapolate; state.chips.splice(i + 1, 0, n); openChips.add(n.id); changed(true, true);
    });
    on('del', () => {
      state.chips.forEach(o => { if (o.extrapolate && (o.extrapolate.from === c.id || o.extrapolate.to === c.id)) { freeze(o, res); } });
      state.chips.splice(i, 1);
      if (state.baseline === c.id && state.chips[0]) state.baseline = state.chips[0].id;
      changed(true, true);
    });
    on('extr', e => {
      if (e.target.checked) c.extrapolate = { from: others[1].id, to: others[0].id };
      else freeze(c, res);
      changed(true, true);
    });
    on('efrom', e => { c.extrapolate.from = e.target.value; changed(true, true); });
    on('eto', e => { c.extrapolate.to = e.target.value; changed(true, true); });
    box.appendChild(el);
  });
}
function freeze(c, res) { const r = res[state.chips.indexOf(c)]; for (const [k] of SPEC_FIELDS) c[k] = r[k]; delete c.extrapolate; }

function renderAssumptions() {
  const A = Model.ASSUME, MD = Model.MODEL;
  const rows = [
    ['Model', `MegaLlama-3T: ${(MD.totalParams / 1e12).toFixed(2)}T params, ${MD.layers} layers, d=${MD.d}, ${MD.nHeads} query / ${MD.nKvHeads} KV heads × ${MD.headDim}, SwiGLU FFN ${MD.ffn}, vocab ${MD.vocab}`],
    ['Precision', `NVFP4 weights and GEMMs (${A.weightBytes} B/param incl. scales), FP8 KV cache and attention, BF16 activations`],
    ['Achievable', `${pct(A.effHbm)} of HBM bandwidth, ${pct(A.effFlops)} of tensor FLOPs, ${pct(A.effLink)} of link bandwidth — same for every chip`],
    ['Latency', `${A.nvlCollectiveUs} µs per NVLink collective (2 per layer), ${A.nvlP2pUs} µs NVLink send, ${A.netP2pUs} µs scale-out send, ${A.layerOverheadUs} µs fixed per layer`],
    ['Kernels', `each op costs max(bytes ÷ BW, FLOPs ÷ peak); decode GEMM token dim padded to ${A.gemmTile}`],
    ['Decode', `time per token = sum over all layers; collectives on the critical path; PP keeps one microbatch per stage in flight`],
    ['Memory', `${pct(A.hbmUsable)} of HBM for weights + KV; KV reserved for full input + output length`],
    ['Prefill', `separate GPU pool, compute-bound at achievable FLOPs; its GPU-seconds are charged to each request`],
    ['Search', `every TP width dividing the NVLink domain, attention TP 1/2/4/8 (DP attention), PP 1–8; plotted line is the best config at each x`],
    ['Speed of light', `100% of spec, no padding, no per-layer overhead; link latencies kept`],
  ];
  document.getElementById('assume').innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  document.getElementById('keys').innerHTML = SPLIT.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');
}

function changed(hard, rerender) {
  saveState();
  if (hard) cache = null;
  if (rerender) renderControls();
  draw();
}

for (const id of ['xmode', 'ymetric']) document.getElementById(id).addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v || v === state[id]) return;
  state[id] = v; if (id === 'xmode') pinnedX = null; changed(true, true);
});
document.getElementById('baseline').onchange = e => { state.baseline = e.target.value; changed(false); };
for (const id of ['isl', 'osl']) document.getElementById(id).onchange = e => { state[id] = Math.max(1, parseInt(e.target.value) || 1); changed(true); };
for (const id of ['sol', 'prefill', 'pp', 'dpattn']) document.getElementById(id).onchange = e => { state[id] = e.target.checked; changed(true); };
for (const id of ['logy', 'gains']) document.getElementById(id).onchange = e => { state[id] = e.target.checked; changed(false); };
document.getElementById('addchip').onclick = () => {
  const n = { id: newId(), name: 'Custom chip', color: PALETTE[state.chips.length % PALETTE.length], visible: true,
    fp4: 15, fp8: 5, hbmGB: 288, hbmTBs: 8, nvlTBs: 1.8, domain: 72, nicGbps: 800, watts: 1900 };
  state.chips.push(n); openChips.add(n.id); changed(true, true);
};
document.getElementById('reset').onclick = () => { state = structuredClone(DEFAULT_STATE); pinnedX = null; openChips.clear(); changed(true, true); };

// ---------------------------------------------------------------- compute
function compute() {
  const chips = resolvedChips();
  const work = { isl: state.isl, osl: state.osl, includePrefill: state.prefill };
  const strat = { pp: state.pp, dpAttn: state.dpattn };
  let grid;
  if (state.xmode === 'interactivity') {
    const xmax = Math.max(10, ...chips.filter(c => c.visible).map(c => Model.maxInteractivity(c, work, strat, state.sol)));
    const n = 200;
    grid = Array.from({ length: n }, (_, i) => xmax * 1.01 * (i + 1) / n);
  } else {
    const n = 160, lo = 0.01, hi = 400;
    grid = Array.from({ length: n }, (_, i) => lo * Math.pow(hi / lo, i / (n - 1)));
  }
  const series = chips.map(c => ({
    chip: c,
    pts: c.visible ? Model.frontier(c, work, strat, state.xmode, grid, state.ymetric, false) : [],
    sol: c.visible && state.sol ? Model.frontier(c, work, strat, state.xmode, grid, state.ymetric, true) : [],
  }));
  // Concurrency view: a point with more users but no more throughput than a lower-concurrency
  // point is dominated (worse latency, no gain), so it is not on the Pareto frontier.
  if (state.xmode === 'concurrency') for (const s of series) for (const k of ['pts', 'sol']) {
    let best = -Infinity;
    s[k] = s[k].map(p => { if (!p || p.y <= best) return null; best = p.y; return p; });
  }
  // Interactivity view: at the left end the best config is already at its max batch (HBM full), so
  // the frontier would run flat to x = 0. Start the line at the max-batch point instead.
  if (state.xmode === 'interactivity') for (const s of series) for (const k of ['pts', 'sol']) {
    let started = false;
    s[k] = s[k].map(p => { if (!started && p && p.interactivity <= p.x * 1.02) started = true; return started ? p : null; });
  }
  return { grid, series };
}

// ---------------------------------------------------------------- plot (plain SVG)
const NS = 'http://www.w3.org/2000/svg';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceTicks(lo, hi, n) {
  const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toPrecision(10));
  return out;
}
function logTicks(lo, hi) { const out = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v); } return out; }
function fmt(v) { return v >= 100 ? Math.round(v).toLocaleString() : v >= 10 ? v.toFixed(1).replace(/\.0$/, '') : v >= 1 ? v.toFixed(2).replace(/\.?0+$/, '') : +v.toPrecision(2) + ''; }
// Linear or log scale from domain [d0, d1] to pixels [p0, p1]. d0 > d1 reverses the axis.
function scale(d0, d1, p0, p1, log) {
  const t = log ? Math.log : (v => v), it = log ? Math.exp : (v => v);
  const a = t(d0), b = t(d1);
  return { d0, d1, log, f: v => p0 + (t(v) - a) / (b - a) * (p1 - p0), inv: p => it(a + (p - p0) / (p1 - p0) * (b - a)) };
}
function path(pts, xs, ys) {
  let d = '', pen = false;
  for (const p of pts) { if (!p) { pen = false; continue; } d += (pen ? 'L' : 'M') + xs.f(p[0]).toFixed(1) + ',' + ys.f(p[1]).toFixed(1); pen = true; }
  return d;
}

// ---------------------------------------------------------------- view model + animated paint
// A "view" is everything needed to paint the chart: axes, curves in data coordinates, gain markers.
// When the view changes, curves morph from the old view to the new one (resampled by arc length
// and interpolated in screen space); axes tween when their type is unchanged and cross-fade otherwise.
let ANIM_MS = 750;
let lastView = null, anim = null, manualClock = null;
const now = () => manualClock != null ? manualClock : performance.now();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

function buildView() {
  if (!cache) cache = compute();
  const { grid, series } = cache;
  const vis = series.filter(s => s.chip.visible);
  const conc = state.xmode === 'concurrency';
  const svg = document.getElementById('plot');
  const W = svg.clientWidth || 800, H = Math.round(Math.max(340, Math.min(560, window.innerHeight * 0.62)));
  const m = { l: 56, r: 12, t: 8, b: 40 };
  const all = vis.flatMap(s => s.pts.concat(s.sol).filter(Boolean));
  // state.ymax (URL only) pins the Y range.
  const ymax = state.ymax || (all.length ? Math.max(...all.map(p => p.y)) * 1.06 : 1);
  let xs;
  if (conc) {
    const xv = all.map(p => p.x), lo = xv.length ? Math.min(...xv) : 0.01, hi = xv.length ? Math.max(...xv) : 100;
    xs = scale(hi, lo, m.l, W - m.r, true);   // high concurrency on the left, low on the right
  } else xs = scale(0, grid[grid.length - 1], m.l, W - m.r, false);
  const ymin = state.logy && all.length ? Math.max(ymax / 1e3, Math.min(...all.map(p => p.y)) * 0.8) : 0;
  const ys = scale(state.logy ? ymin : 0, ymax, H - m.b, m.t, state.logy);

  const curves = {};
  const ordered = vis.slice().reverse();     // first-listed chip drawn last, on top
  for (const s of ordered) if (state.sol) curves[s.chip.id + ':sol'] = { color: s.chip.color, sol: true, data: s.sol.filter(p => p && p.y >= ys.d0).map(p => [p.x, p.y]) };
  for (const s of ordered) curves[s.chip.id] = { color: s.chip.color, sol: false, data: s.pts.filter(p => p && p.y >= ys.d0).map(p => [p.x, p.y]) };

  return {
    W, H, m, xs, ys, xmode: state.xmode, ylog: !!state.logy, grid, vis, curves,
    order: state.chips.map(c => c.id),
    xlab: conc ? 'Concurrent users per decode GPU (log, decreasing →)' : 'Interactivity (output tok/s per user)',
    ylab: state.ymetric === 'perKW' ? 'Output tok/s per kW (all-in power)' : 'Output tok/s per GPU',
    gains: state.gains ? gainMarkers(vis, xs, ys) : [],
  };
}

// For each chip and the next one down the list (the previous generation), the throughput multiple
// at three points: high throughput, middle, and low latency (left, center, right of the range
// where both curves exist). Returned in data coordinates.
function gainMarkers(vis, xs, ys) {
  const out = [];
  for (let k = 0; k + 1 < vis.length; k++) {
    const nu = vis[k], old = vis[k + 1];
    const idx = nu.pts.map((p, i) => p && old.pts[i] && old.pts[i].y >= ys.d0 ? i : -1).filter(i => i >= 0);
    if (idx.length < 3) continue;
    const px = i => xs.f(nu.pts[i].x);
    const lo = Math.min(...idx.map(px)), hi = Math.max(...idx.map(px));
    for (const f of [0.1, 0.5, 0.85]) {
      // In the concurrency view both pairs span the same x range, so stagger them to keep labels apart.
      const target = Math.min(hi, lo + f * (hi - lo) + (state.xmode === 'concurrency' ? k * 44 : 0));
      const i = idx.reduce((a, b) => Math.abs(px(b) - target) < Math.abs(px(a) - target) ? b : a);
      out.push({ x: nu.pts[i].x, y0: old.pts[i].y, y1: nu.pts[i].y, color: nu.chip.color, label: (nu.pts[i].y / old.pts[i].y).toFixed(1) + '×' });
    }
  }
  return out;
}

// Interpolate two scales of the same type (pixel range from b).
function tweenScale(a, b, e) {
  if (a.log !== b.log) return b;
  const t = a.log ? Math.log : (v => v), it = a.log ? Math.exp : (v => v);
  return rescale(scale(it(lerp(t(a.d0), t(b.d0), e)), it(lerp(t(a.d1), t(b.d1), e)), 0, 1, a.log), b);
}
function rescale(s, ref) { // map s's domain onto ref's pixel range
  const p0 = ref.f(ref.d0), p1 = ref.f(ref.d1);
  return scale(s.d0, s.d1, p0, p1, s.log);
}

function resample(pts, n) {
  if (!pts.length) return null;
  if (pts.length === 1) return Array.from({ length: n }, () => pts[0]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = cum[cum.length - 1] || 1, out = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const s = L * k / (n - 1);
    while (j < pts.length - 2 && cum[j + 1] < s) j++;
    const f = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    out.push([lerp(pts[j][0], pts[j + 1][0], f), lerp(pts[j][1], pts[j + 1][1], f)]);
  }
  return out;
}
// Concurrency curves run right-to-left in data order; order every curve high-throughput end first.
function screenPts(view, key, xs, ys) {
  const c = view.curves[key];
  if (!c || !c.data.length) return null;
  let pts = c.data.map(p => [xs.f(p[0]), ys.f(p[1])]);
  if (pts.length > 1 && pts[0][1] > pts[pts.length - 1][1]) pts = pts.slice().reverse();
  return resample(pts, 240);
}
// Where a curve that appears (or disappears) grows from (or shrinks into).
function partnerKey(view, key, other) {
  if (key.endsWith(':sol')) return key.slice(0, -4) in other.curves ? key.slice(0, -4) : null;
  const order = view.order, i = order.indexOf(key);
  for (let d = 1; d < order.length; d++) for (const j of [i + d, i - d]) if (order[j] && order[j] in other.curves) return order[j];
  return null;
}

function axesSVG(svg, v, xs, ys, xop, yop, drawX, drawY) {
  const gridC = css('--grid'), muted = css('--muted'), fg = css('--fg');
  const pw = v.W - v.m.l - v.m.r, ph = v.H - v.m.t - v.m.b;
  if (drawY && yop > 0.001) {
    const g = el('g', { opacity: yop }, svg);
    const lo = Math.min(ys.d0, ys.d1), hi = Math.max(ys.d0, ys.d1);
    for (const val of ys.log ? logTicks(lo, hi) : niceTicks(lo, hi, Math.max(4, Math.floor(ph / 60)))) {
      const y = ys.f(val);
      el('line', { x1: v.m.l, x2: v.W - v.m.r, y1: y, y2: y, stroke: gridC }, g);
      el('text', { x: v.m.l - 8, y: y + 4, 'text-anchor': 'end', fill: muted, 'font-size': 11 }, g).textContent = fmt(val);
    }
    const cy = v.m.t + ph / 2;
    el('text', { x: 14, y: cy, 'text-anchor': 'middle', fill: fg, 'font-size': 12, transform: `rotate(-90 14 ${cy})` }, g).textContent = v.ylab;
  }
  if (drawX && xop > 0.001) {
    const g = el('g', { opacity: xop }, svg);
    const lo = Math.min(xs.d0, xs.d1), hi = Math.max(xs.d0, xs.d1);
    for (const val of xs.log ? logTicks(lo, hi) : niceTicks(lo, hi, Math.max(4, Math.floor(pw / 90)))) {
      const x = xs.f(val);
      el('line', { x1: x, x2: x, y1: v.m.t, y2: v.H - v.m.b, stroke: gridC }, g);
      el('text', { x, y: v.H - v.m.b + 16, 'text-anchor': 'middle', fill: muted, 'font-size': 11 }, g).textContent = fmt(val);
    }
    el('text', { x: v.m.l + pw / 2, y: v.H - 6, 'text-anchor': 'middle', fill: fg, 'font-size': 12 }, g).textContent = v.xlab;
  }
}

function gainsSVG(svg, markers, xs, ys, op) {
  if (op <= 0.001) return;
  const bg = css('--bg'), g = el('g', { opacity: op }, svg);
  for (const mk of markers) {
    const x = xs.f(mk.x), y0 = ys.f(mk.y0), y1 = ys.f(mk.y1);
    el('line', { x1: x, x2: x, y1: y0, y2: y1, stroke: mk.color, 'stroke-width': 1.25 }, g);
    for (const y of [y0, y1]) el('line', { x1: x - 3, x2: x + 3, y1: y, y2: y, stroke: mk.color, 'stroke-width': 1.25 }, g);
    const small = Math.abs(y0 - y1) < 22; // gap too thin to hold the label: put it above the top end
    el('text', { x: small ? x : x + 6, y: small ? y1 - 7 : (y0 + y1) / 2 + 4, 'text-anchor': small ? 'middle' : 'start', fill: mk.color, 'font-size': 12, 'font-weight': 600,
      stroke: bg, 'stroke-width': 3, 'paint-order': 'stroke' }, g).textContent = mk.label;
  }
}

// Paint the transition from view A to view B at eased progress e (A = null: static B).
function paint(A, B, e) {
  const svg = document.getElementById('plot');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${B.W} ${B.H}`); svg.setAttribute('height', B.H);
  if (!A) { A = B; e = 1; }
  const sameX = A.xmode === B.xmode && A.xs.log === B.xs.log;
  const sameY = A.ylog === B.ylog;
  const xsT = sameX ? tweenScale(A.xs, B.xs, e) : null, ysT = sameY ? tweenScale(A.ys, B.ys, e) : null;
  const axA = { xs: xsT || rescale(A.xs, B.xs), ys: ysT || rescale(A.ys, B.ys) };
  const axB = { xs: xsT || B.xs, ys: ysT || B.ys };

  // axes: tween in place, or cross-fade old → new
  if (sameX && sameY) axesSVG(svg, Object.assign({}, B, { ylab: e < 0.5 ? A.ylab : B.ylab }), axB.xs, axB.ys, 1, 1, true, true);
  else {
    // old axis fades out over the first half, new one fades in over the second, so labels never overlap
    const out = Math.max(0, 1 - 2 * e), inn = Math.max(0, 2 * e - 1);
    axesSVG(svg, A, axA.xs, axA.ys, out, out, !sameX, !sameY);
    axesSVG(svg, B, axB.xs, axB.ys, sameX ? 1 : inn, sameY ? 1 : inn, true, true);
  }
  const line = css('--line');
  el('line', { x1: B.m.l, x2: B.W - B.m.r, y1: B.H - B.m.b, y2: B.H - B.m.b, stroke: line }, svg);

  // curves
  const clip = el('clipPath', { id: 'plotclip' }, el('defs', {}, svg));
  el('rect', { x: B.m.l, y: 0, width: B.W - B.m.l - B.m.r + 4, height: B.H - B.m.b + 2 }, clip);
  const g = el('g', { 'clip-path': 'url(#plotclip)' }, svg);
  const keys = [...new Set(Object.keys(A.curves).filter(k => !(k in B.curves)).concat(Object.keys(B.curves)))];
  // dashed lines first, then solid; the first-listed chip is drawn last (on top)
  const weight = k => (k.endsWith(':sol') ? 0 : 1000) - B.order.indexOf(k.replace(':sol', ''));
  keys.sort((a, b) => weight(a) - weight(b));
  for (const k of keys) {
    const inA = k in A.curves, inB = k in B.curves;
    let from = inA ? screenPts(A, k, axA.xs, axA.ys) : null, to = inB ? screenPts(B, k, axB.xs, axB.ys) : null;
    if (!from && to) { const pk = partnerKey(B, k, A); from = pk ? screenPts(A, pk, axA.xs, axA.ys) : to.map(p => [p[0], B.H - B.m.b]); }
    if (!to && from) { const pk = partnerKey(A, k, B); to = pk ? screenPts(B, pk, axB.xs, axB.ys) : from.map(p => [p[0], B.H - B.m.b]); }
    if (!from || !to) continue;
    const pts = e >= 1 ? to : e <= 0 ? from : to.map((p, i) => [lerp(from[i][0], p[0], e), lerp(from[i][1], p[1], e)]);
    const c = (inB ? B : A).curves[k];
    const op = (inA && inB) ? 1 : inB ? Math.min(1, e * 2.5) : Math.max(0, 1 - e * 2.5);
    if (op <= 0.001) continue;
    el('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: c.color,
      'stroke-width': c.sol ? 1.25 : 2.25, 'stroke-dasharray': c.sol ? '4 3' : '', opacity: (c.sol ? 0.8 : 1) * op, 'stroke-linejoin': 'round' }, g);
  }

  // gain markers fade out over the first quarter of the morph and back in over the last quarter
  if (A === B) gainsSVG(svg, B.gains, B.xs, B.ys, 1);
  else { gainsSVG(svg, A.gains, axA.xs, axA.ys, Math.max(0, 1 - e / 0.25)); gainsSVG(svg, B.gains, axB.xs, axB.ys, Math.max(0, (e - 0.75) / 0.25)); }
  return svg;
}

function finishView(v) {
  const svg = paint(null, v, 1), muted = css('--muted');
  const cursor = el('g', { visibility: 'hidden' }, svg);
  el('line', { y1: v.m.t, y2: v.H - v.m.b, stroke: muted, 'stroke-dasharray': '3 3' }, cursor);
  const dots = v.vis.map(s => el('circle', { r: 4, fill: s.chip.color, stroke: css('--bg'), 'stroke-width': 1.5 }, cursor));
  geo = { xs: v.xs, ys: v.ys, m: v.m, W: v.W, H: v.H, grid: v.grid, vis: v.vis, cursor, dots };
  if (pinnedX != null) showAt(pinnedX); else clearReadout();
}

function tick() {
  if (!anim) return;
  const u = Math.min(1, Math.max(0, (now() - anim.start) / ANIM_MS));
  if (u >= 1) { const v = anim.to; anim = null; finishView(v); return; }
  paint(anim.from, anim.to, ease(u));
  if (manualClock == null) requestAnimationFrame(tick);
}

function draw(opts) {
  const v = buildView();
  document.getElementById('legend').innerHTML = v.vis.map(s => `<span><i style="background:${s.chip.color}"></i>${esc(s.chip.name)}</span>`).join('')
    + (state.sol ? `<span style="color:var(--muted)"><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)"></i>speed of light</span>` : '');
  const from = lastView;
  lastView = v;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!from || (opts && opts.instant) || reduce) { anim = null; finishView(v); return; }
  geo = null; clearReadout();
  anim = { from, to: v, start: now() };
  tick();
}

// Hooks for tools/record: drive the animation clock by hand.
window.__chipference = {
  setClock(ms) { manualClock = ms; tick(); },
  setDuration(ms) { ANIM_MS = ms; },
  animating: () => !!anim,
};

function clearReadout() { document.getElementById('read').innerHTML = ''; document.getElementById('hint').style.display = ''; document.getElementById('keys').style.display = 'none'; }
function nearestIdx(x) {
  const g = geo.grid, f = geo.xs.log ? Math.log : (v => v);
  let bi = 0; for (let i = 1; i < g.length; i++) if (Math.abs(f(g[i]) - f(x)) < Math.abs(f(g[bi]) - f(x))) bi = i; return bi;
}

function showAt(x) {
  const { xs, ys, cursor, dots, vis } = geo;
  const i = nearestIdx(x), gx = geo.grid[i], px = xs.f(gx);
  cursor.setAttribute('visibility', 'visible');
  cursor.querySelector('line').setAttribute('x1', px); cursor.querySelector('line').setAttribute('x2', px);
  vis.forEach((s, k) => { const p = s.pts[i]; dots[k].setAttribute('visibility', p ? 'visible' : 'hidden'); if (p) { dots[k].setAttribute('cx', px); dots[k].setAttribute('cy', ys.f(p.y)); } });

  const base = vis.find(s => s.chip.id === state.baseline) || null;
  const bp = base && base.pts[i];
  const unit = state.ymetric === 'perKW' ? 'tok/s/kW' : 'tok/s/GPU';
  const at = state.xmode === 'interactivity' ? `≥ ${fmt(gx)} tok/s/user` : `${fmt(gx)} users/GPU`;
  let h = `<tr><th>${at}${pinnedX != null ? ' · pinned' : ''}</th><th class="num">${unit}</th><th class="num">vs ${esc(base ? base.chip.name : '—')}</th><th class="num">HBM BW ×</th><th>Best config</th><th class="num">ms/token</th><th>Where time goes</th></tr>`;
  for (const s of vis) {
    const p = s.pts[i];
    const hb = base ? (s.chip.hbmTBs / base.chip.hbmTBs).toFixed(2) + '×' : '';
    const name = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.chip.color};margin-right:6px"></span>${esc(s.chip.name)}`;
    if (!p) { h += `<tr><td>${name}</td><td class="num" style="color:var(--muted)">—</td><td></td><td class="num">${hb}</td><td style="color:var(--muted)" colspan="3">can't reach this point</td></tr>`; continue; }
    const c = p.cfg;
    const cfg = (c.a < c.t ? `Attn TP${c.a}×DP${c.t / c.a}, FFN TP${c.t}` : `TP${c.t}`) + (c.p > 1 ? ` · PP${c.p}${p.ppOverNet ? ' (IB)' : ''}` : '') + ` · ${Math.round(p.B).toLocaleString()} users / ${p.chips} GPUs`;
    const bar = SPLIT.map(([k, l, col]) => `<b style="width:${(p.br[k] / p.tpot * 100).toFixed(1)}%;background:${col}" title="${l} ${pct(p.br[k] / p.tpot)}"></b>`).join('');
    h += `<tr><td>${name}</td><td class="num">${fmt(p.y)}</td><td class="num">${bp ? (p.y / bp.y).toFixed(2) + '×' : '—'}</td><td class="num">${hb}</td><td>${cfg}</td><td class="num">${(p.tpot * 1e3).toFixed(1)}</td><td><div class="bar">${bar}</div></td></tr>`;
  }
  document.getElementById('read').innerHTML = h;
  document.getElementById('hint').style.display = 'none';
  document.getElementById('keys').style.display = '';
}

(function () {
  const svg = document.getElementById('plot');
  const toX = e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (geo.W / r.width); return px < geo.m.l || px > geo.W - geo.m.r ? null : geo.xs.inv(px); };
  svg.addEventListener('mousemove', e => { if (pinnedX != null || !geo) return; const x = toX(e); if (x != null) showAt(x); });
  svg.addEventListener('mouseleave', () => { if (pinnedX == null && geo) { geo.cursor.setAttribute('visibility', 'hidden'); clearReadout(); } });
  svg.addEventListener('click', e => { if (!geo) return; const x = toX(e); if (x == null) return; pinnedX = pinnedX != null ? null : x; showAt(x); });
})();
window.addEventListener('resize', () => draw({ instant: true }));
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw({ instant: true }));

renderControls();
renderAssumptions();
draw();
</script>
</body>
</html>
